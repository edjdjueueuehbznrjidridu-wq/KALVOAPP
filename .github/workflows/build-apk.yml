name: Build KALVO APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Buildozer Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      BUILDOZER_WARN_ON_ROOT: "0"
      APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Extract project zip if needed
        run: |
          set -euo pipefail
          if [ -f main.py ]; then
            echo "main.py at root"
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -1 || true)
            if [ -z "${ZIP:-}" ]; then echo "No main.py/zip"; ls -la; exit 1; fi
            echo "Extracting $ZIP"
            unzip -o "$ZIP" -d _e
            if [ -f _e/main.py ]; then cp -a _e/. .; else
              SUB=$(find _e -name main.py | head -1 | xargs -r dirname)
              test -n "${SUB:-}"; cp -a "$SUB"/. .
            fi
            rm -rf _e
          fi
          test -f main.py
          test -d apex
          ls -la

      - name: Write known-good buildozer.spec
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path("buildozer.spec").write_text("""[app]
          title = KALVO Market Lab
          package.name = kalvomax
          package.domain = org.kalvo.lab
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,json,txt
          source.exclude_dirs = tests,bin,.git,__pycache__,.buildozer,.github
          version = 6.1.0
          requirements = python3,kivy==2.2.1,certifi,pyjnius
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET,ACCESS_NETWORK_STATE
          android.api = 33
          android.minapi = 24
          android.ndk = 25b
          android.sdk = 33
          android.accept_sdk_license = True
          android.archs = arm64-v8a
          android.allow_backup = False
          p4a.branch = v2024.01.21
          android.release_artifact = apk
          android.debug_artifact = apk

          [buildozer]
          log_level = 2
          warn_on_root = 0
          bin_dir = ./bin
          """.replace("          ", ""))
          print(Path("buildozer.spec").read_text())
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git unzip zip openjdk-17-jdk python3-pip python3-setuptools \
            autoconf automake libtool pkg-config cmake ccache build-essential \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev libltdl-dev libjpeg-dev libpng-dev \
            gettext libsqlite3-dev liblzma-dev libbz2-dev

      - name: Install Buildozer + Cython + legacy-cgi
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install "cython>=0.29,<3.0" virtualenv legacy-cgi
          python -m pip install git+https://github.com/kivy/buildozer.git
          buildozer --version
          python -c "import cgi; print('cgi ok', cgi)"

      - name: Build APK
        run: buildozer -v android debug

      - name: Collect logs on failure
        if: failure()
        run: |
          ls -la bin/ || true
          find . -name "*.apk" 2>/dev/null | head || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KALVO-Market-Lab-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 21
